# Netlify: set the site's base directory to `website`.
# Every route is prerendered to <route>/index.html, and unknown URLs get dist/404.html
# (Netlify serves it with a 404 status automatically), so no SPA rewrite is needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
