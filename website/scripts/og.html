<!doctype html>
<!-- Source of public/og.png (1200×630). Re-render: node scripts/render-png.mjs -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        color: #fafafa;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(45% 55% at 25% 0%, rgb(59 123 255 / 0.45), transparent 70%),
          radial-gradient(45% 55% at 80% 5%, rgb(139 92 246 / 0.4), transparent 70%);
      }
      .island {
        position: absolute;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        width: 420px;
        height: 64px;
        border-radius: 32px;
        background: #000;
        box-shadow:
          0 0 0 1px rgb(255 255 255 / 0.1),
          0 20px 60px -10px rgb(91 108 255 / 0.6);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px 0 12px;
        box-sizing: border-box;
      }
      .art {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(120deg, #3b7bff, #5b6cff, #8b5cf6);
      }
      .bars {
        display: flex;
        gap: 5px;
        align-items: center;
        height: 26px;
      }
      .bars span {
        width: 5px;
        border-radius: 3px;
        background: linear-gradient(#3b7bff, #8b5cf6);
      }
      h1 {
        position: absolute;
        left: 0;
        right: 0;
        top: 210px;
        margin: 0;
        text-align: center;
        font-size: 88px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        font-weight: 650;
      }
      h1 span {
        background: linear-gradient(100deg, #3b7bff, #5b6cff 45%, #8b5cf6);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 64px;
        margin: 0;
        text-align: center;
        font-size: 28px;
        color: rgb(255 255 255 / 0.62);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="island">
      <div class="art"></div>
      <div class="bars">
        <span style="height: 40%"></span><span style="height: 90%"></span
        ><span style="height: 60%"></span><span style="height: 100%"></span
        ><span style="height: 45%"></span>
      </div>
    </div>
    <h1>The Dynamic Island,<br /><span>finally on Windows.</span></h1>
    <p>Notchly · Free · Native · about 3.7 MB · Windows 10 &amp; 11</p>
  </body>
</html>
