<html>

        height: 40px;

      }
      .bars {
        display: flex;
        gap: 5px;
        align-items: center;
        height: 26px;
      }
      .bars span {
        width: 5px;
        border-radius: 3px;
        background: linear-gradient(#3b7bff, #8b5cf6);
      }
      h1 {
        position: absolute;
        left: 0;
        right: 0;

        font-weight: 650;

        background: linear-gradient(100deg, #3b7bff, #5b6cff 45%, #8b5cf6);

      }
      .real {
        position: absolute;
        top: 0;

        transform: translateX(-50%);

        position: absolute;
        top: 72px;
        left: 64px;

        gap: 14px;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 52px;
        height: 52px;
      }
      p {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 64px;
