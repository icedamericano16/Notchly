<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <title>Notchly — The Dynamic Island, finally on Windows</title>
    <meta
      name="description"

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Notchly" />
    <meta property="og:title" content="Notchly — The Dynamic Island, finally on Windows" />

      property="og:description"
      content="Free, native, about 3.7 MB. Music, timers, calls, AI and 40+ tools, living in your notch."

    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <style>
      /* Paint true black before CSS loads: no white flash. */
      html,
      body {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #fafafa; font: 16px system-ui; padding: 24px">
