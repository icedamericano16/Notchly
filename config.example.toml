# Notchly build settings — EXAMPLE. Copy to `config.toml` (git-ignored) and fill in what you
# use; build.rs bakes these into the exe. Environment variables with the same names win (CI
# uses repository variables and secrets). Every value is optional.
# Never commit config.toml. See RELEASE_SETUP.md for where each value comes from.

# Google Calendar sign-in (Google Cloud > APIs & Services > Credentials > OAuth client,
# type "Desktop app"). Google treats a desktop client's secret as non-confidential.
NOTCHLY_GOOGLE_CLIENT_ID = "123456789012-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com"
NOTCHLY_GOOGLE_CLIENT_SECRET = "GOCSPX-replace-me"

# Outlook / Microsoft 365 sign-in (Microsoft Entra > App registrations > Application ID).
NOTCHLY_MS_CLIENT_ID = "00000000-0000-0000-0000-000000000000"

# Updates: where the signed manifest lives and the public key it must be signed with
# (packaging/update-key.ps1 prints both halves; only the PUBLIC key goes here).
NOTCHLY_UPDATE_FEED = "https://github.com/OWNER/REPO/releases/latest/download/update.json"
NOTCHLY_UPDATE_PUBKEY = "base64-of-64-bytes-public-key"

# Links shown in Settings > About and on the crash notice.
NOTCHLY_WEBSITE = "https://example.com/notchly"
NOTCHLY_SUPPORT_URL = "https://github.com/OWNER/REPO/issues"
