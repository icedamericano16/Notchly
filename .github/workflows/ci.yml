name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # the repo's .cargo/config.toml pins a local VS install; CI uses the runner's toolchain
      - name: Drop machine-local cargo config
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: Size budget (4 MB)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/notchly.exe).Length
          "notchly.exe: {0:N2} MB" -f ($size / 1MB)
          if ($size -gt 4MB) { throw "notchly.exe exceeds the 4 MB budget" }
      - name: Sign (Azure Trusted Signing)
        if: startsWith(github.ref, 'refs/tags/')
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
      - name: Installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\inno\notchly.iss
      - name: MSIX
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force msix | Out-Null
          Copy-Item target/release/notchly.exe msix/
          Copy-Item packaging/msix/AppxManifest.xml msix/
          New-Item -ItemType Directory -Force msix/Assets | Out-Null
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d msix /p dist/Notchly.msix /o
      - uses: actions/upload-artifact@v4
        with:
          name: notchly
          path: |
            target/release/notchly.exe
            dist/*
