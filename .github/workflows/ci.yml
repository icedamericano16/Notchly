name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # the repo's .cargo/config.toml pins a local VS install; CI uses the runner's toolchain
      - name: Drop machine-local cargo config
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: Size budget (4 MB)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/notchly.exe).Length
          "notchly.exe: {0:N2} MB" -f ($size / 1MB)
          if ($size -gt 4MB) { throw "notchly.exe exceeds the 4 MB budget" }
      - name: Release packages (sign, sparse identity, Store MSIX, installer, update feed)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          NOTCHLY_UPDATE_FEED: ${{ vars.NOTCHLY_UPDATE_FEED }}
          NOTCHLY_WEBSITE: ${{ vars.NOTCHLY_WEBSITE }}
          NOTCHLY_SUPPORT_URL: ${{ vars.NOTCHLY_SUPPORT_URL }}
          NOTCHLY_GOOGLE_CLIENT_ID: ${{ vars.NOTCHLY_GOOGLE_CLIENT_ID }}
          NOTCHLY_GOOGLE_CLIENT_SECRET: ${{ secrets.NOTCHLY_GOOGLE_CLIENT_SECRET }}
          NOTCHLY_MS_CLIENT_ID: ${{ vars.NOTCHLY_MS_CLIENT_ID }}
        run: |
          choco install innosetup -y --no-progress
          ./packaging/build.ps1 -Publisher "${{ vars.NOTCHLY_PUBLISHER }}" `
            -StorePublisher "${{ vars.NOTCHLY_STORE_PUBLISHER }}" `
            -StoreIdentity "${{ vars.NOTCHLY_STORE_IDENTITY || 'Notchly.Notchly' }}" `
            -DownloadBase "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: notchly
          path: |
            dist/*.exe
            dist/*.msix
            dist/update.json
