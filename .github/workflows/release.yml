# Builds and publishes a GitHub Release for every version tag (v0.3.0 …), on the zero-cost
# path (RELEASE_SETUP.md):
#   - the Microsoft Store package (MSIX) for Partner Center, as a workflow artifact; the Store
#     signs, hosts and updates it for free;
#   - the direct installer and portable exe, labelled "advanced / unsigned";
#   - SHA256SUMS.txt, a signed update manifest (when the key secret exists) and a winget
#     manifest (workflow artifact) for a pull request to microsoft/winget-pkgs;
#   - release notes with ONLY this version's CHANGELOG section.
# Every secret and variable is optional; see docs/KEYS_AND_SECRETS.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      # where the app looks for updates: this repository's latest release
      NOTCHLY_UPDATE_FEED: ${{ vars.NOTCHLY_UPDATE_FEED || format('https://github.com/{0}/releases/latest/download/update.json', github.repository) }}
      NOTCHLY_UPDATE_PUBKEY: ${{ vars.NOTCHLY_UPDATE_PUBKEY }}
      NOTCHLY_UPDATE_SIGNING_KEY: ${{ secrets.NOTCHLY_UPDATE_SIGNING_KEY }}
      # escape hatch only: releases without the update key can't update themselves
      NOTCHLY_ALLOW_UNVERIFIED_UPDATES: ${{ vars.NOTCHLY_ALLOW_UNVERIFIED_UPDATES }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Drop machine-local cargo config
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue
      - name: Tag, Cargo.toml and CHANGELOG agree
        shell: pwsh
        run: ./packaging/release-check.ps1 -Tag $env:TAG -Repository $env:REPO -Stage pre
      - name: Tests
        run: cargo test
      - name: Build and package
        shell: pwsh
        env:
          NOTCHLY_WEBSITE: ${{ vars.NOTCHLY_WEBSITE || 'https://notchly.web.app' }}
          NOTCHLY_SUPPORT_URL: ${{ vars.NOTCHLY_SUPPORT_URL || format('https://github.com/{0}/issues', github.repository) }}
          NOTCHLY_GOOGLE_CLIENT_ID: ${{ vars.NOTCHLY_GOOGLE_CLIENT_ID }}
          NOTCHLY_GOOGLE_CLIENT_SECRET: ${{ secrets.NOTCHLY_GOOGLE_CLIENT_SECRET }}
          NOTCHLY_MS_CLIENT_ID: ${{ vars.NOTCHLY_MS_CLIENT_ID }}
          # Optional code signing, OFF by default. SignPath Foundation (free) only signs
          # OSI-licensed open source; enable it with the variable NOTCHLY_SIGNPATH_ENABLED=true
          # after acceptance (RELEASE_SETUP.md). A .pfx certificate also works if you have one.
          SIGNPATH_API_TOKEN: ${{ vars.NOTCHLY_SIGNPATH_ENABLED == 'true' && secrets.SIGNPATH_API_TOKEN || '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          NOTCHLY_PFX_BASE64: ${{ secrets.NOTCHLY_PFX_BASE64 }}
          NOTCHLY_PFX_PASSWORD: ${{ secrets.NOTCHLY_PFX_PASSWORD }}
          NOTCHLY_TIMESTAMP_URL: ${{ vars.NOTCHLY_TIMESTAMP_URL }}
        run: |
          choco install innosetup -y --no-progress
          ./packaging/build.ps1 -Publisher "${{ vars.NOTCHLY_PUBLISHER }}" `
            -StorePublisher "${{ vars.NOTCHLY_STORE_PUBLISHER }}" `
            -StoreIdentity "${{ vars.NOTCHLY_STORE_IDENTITY || 'Notchly.Notchly' }}" `
            -DownloadBase "https://github.com/$env:REPO/releases/download/$env:TAG"
      - name: Update manifest, keys and installer agree
        shell: pwsh
        run: ./packaging/release-check.ps1 -Tag $env:TAG -Repository $env:REPO -Stage post
      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          # the public downloads only (the Store package is an artifact for Partner Center)
          Get-ChildItem -File -Filter *.exe | Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location
      - name: winget manifest
        shell: pwsh
        run: ./packaging/winget.ps1 -Tag $env:TAG -Repository $env:REPO
      - name: Scoop manifest
        shell: pwsh
        run: ./packaging/scoop.ps1 -Tag $env:TAG -Repository $env:REPO
      - name: Release notes (this version only)
        shell: pwsh
        run: ./packaging/release-notes.ps1 -Tag $env:TAG -Out notes.md -StoreUrl "${{ vars.NOTCHLY_STORE_URL }}"
      - name: Store package, winget and Scoop manifests (artifacts, not public downloads)
        uses: actions/upload-artifact@v4
        with:
          name: notchly-${{ github.ref_name }}-packages
          path: |
            dist/*.msix
            dist/winget/**
            dist/scoop/**
          if-no-files-found: warn
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object {
              $_.Extension -eq ".exe" -or $_.Name -like "update.json*" -or $_.Name -eq "SHA256SUMS.txt"
            } | ForEach-Object { $_.FullName })
          gh release create $env:TAG @files --title "Notchly $env:TAG" --notes-file notes.md --verify-tag --latest
