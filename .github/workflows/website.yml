# Website: lint, typecheck and build on every change under website/. Deploying to GitHub
# Pages is manual (Actions › Website › Run workflow) so it never replaces the current Pages
# site by surprise. Before the first deploy: Settings › Pages › Source: "GitHub Actions".
# The deploy keeps docs/privacy.html (and any Google verification file) at the same URLs.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GitHub Pages'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # Served from https://<owner>.github.io/<repo>/
      BASE_PATH: /${{ github.event.repository.name }}/
      VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - name: Prepare Pages output
        run: |
          # Routes are prerendered to <route>/index.html and dist/404.html by `npm run build`.
          # Keep the privacy policy URL used for Google verification, and any verification file.
          cp ../docs/privacy.html dist/privacy.html
          cp ../docs/google*.html dist/ 2>/dev/null || true
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
